<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Minhas Finanças</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="icon.svg" alt=""><span>Minhas Finanças</span></div>
    <nav class="nav">
      <a href="#/" data-route="dashboard"><span class="ico">◎</span><span>Resumo</span></a>
      <a href="#/lancamentos" data-route="lancamentos"><span class="ico">≡</span><span>Lançamentos</span></a>
      <a href="#/fixas" data-route="fixas"><span class="ico">↻</span><span>Contas fixas</span></a>
      <a href="#/cartoes" data-route="cartoes"><span class="ico">▭</span><span>Cartões</span></a>
      <a href="#/config" data-route="config"><span class="ico">⚙</span><span>Ajustes</span></a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="brand mobile-only"><img src="icon.svg" alt=""><span>Minhas Finanças</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="bell" aria-label="Lembretes">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="badge" id="bell-count" hidden>0</span>
      </button>
      <div class="popover" id="reminders" hidden></div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <button class="fab" id="fab" aria-label="Novo lançamento">+</button>
  <dialog id="modal"></dialog>
  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
