<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6750a4">
  <title>Minhas Finanças</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="icon.svg" alt=""><span>Minhas Finanças</span></div>
    <nav class="nav">
      <a href="#/" data-route="dashboard"><span class="ico msym">space_dashboard</span><span>Resumo</span></a>
      <a href="#/lancamentos" data-route="lancamentos"><span class="ico msym">receipt_long</span><span>Lançamentos</span></a>
      <a href="#/fixas" data-route="fixas"><span class="ico msym">event_repeat</span><span>Contas fixas</span></a>
      <a href="#/cartoes" data-route="cartoes"><span class="ico msym">credit_card</span><span>Cartões</span></a>
      <a href="#/config" data-route="config"><span class="ico msym">settings</span><span>Ajustes</span></a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="brand mobile-only"><img src="icon.svg" alt=""><span>Minhas Finanças</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="sync" aria-label="Sincronização" hidden><span class="msym">cloud</span></button>
      <button class="icon-btn" id="bell" aria-label="Lembretes">
        <span class="msym">notifications</span>
        <span class="badge" id="bell-count" hidden>0</span>
      </button>
      <div class="popover" id="reminders" hidden></div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <button class="fab" id="fab" aria-label="Novo lançamento"><span class="msym">add</span></button>
  <dialog id="modal"></dialog>
  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
